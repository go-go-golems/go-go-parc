<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc"><title id="title">ARM64 memory — reported peak and sampled RSS kept separate</title><desc id="desc">Separate observations with different values. No artificial unified RSS estimate.</desc><rect width="1100" height="490" fill="#ffffff"/><g font-family="sans-serif"><text x="30" y="38" font-size="24" fill="#182b3c">ARM64 memory — reported peak and sampled RSS kept separate</text><text x="30" y="72" font-size="17" fill="#182b3c">Measured process memory in KiB. Heap constraints do not cap total RSS.</text><text x="30" y="127" font-size="17" fill="#182b3c">Bellard</text><rect x="220" y="110" width="81.46666666666667" height="24" rx="6" fill="#246c9c"/><text x="930" y="128" font-size="16" fill="#182b3c">4888 peak</text><rect x="220" y="143" width="87.13333333333334" height="20" rx="6" fill="#b6c2cc"/><text x="930" y="158" font-size="15" fill="#182b3c">5228 sampled</text><text x="30" y="227" font-size="17" fill="#182b3c">QuickJS-ng</text><rect x="220" y="210" width="87.0" height="24" rx="6" fill="#487a35"/><text x="930" y="228" font-size="16" fill="#182b3c">5220 peak</text><rect x="220" y="243" width="89.66666666666667" height="20" rx="6" fill="#b6c2cc"/><text x="930" y="258" font-size="15" fill="#182b3c">5380 sampled</text><text x="30" y="327" font-size="17" fill="#182b3c">V8 / libnode108</text><rect x="220" y="310" width="675.4666666666667" height="24" rx="6" fill="#975124"/><text x="930" y="328" font-size="16" fill="#182b3c">40528 peak</text><rect x="220" y="343" width="678.6" height="20" rx="6" fill="#b6c2cc"/><text x="930" y="358" font-size="15" fill="#182b3c">40716 sampled</text><text x="30" y="435" font-size="15" fill="#182b3c">Colored: reported getrusage peak. Gray: maximum sampled /proc VmRSS; distinct observations.</text><text x="30" y="463" font-size="15" fill="#182b3c">Cooperative 192 MiB guard + 180 s timeout: finite trusted probe, not a hardened sandbox.</text></g></svg>
