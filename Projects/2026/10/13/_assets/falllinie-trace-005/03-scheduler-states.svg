<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img">
<title>Scheduler state reconstruction</title><desc>Proposed analysis; actual payload encodings and clock ordering must be verified</desc>
<rect width="1100" height="480" fill="#f8fafc"/>
<text x="30" y="38" font-family="sans-serif" font-size="25" fill="#0f172a">Scheduler state reconstruction</text>
<text x="30" y="67" font-family="sans-serif" font-size="15" fill="#475569">Proposed analysis; actual payload encodings and clock ordering must be verified</text>
<rect x="35" y="125" width="260" height="85" rx="8" fill="#dcfce7" stroke="#64748b"/>
<text x="49" y="153" font-family="sans-serif" font-size="17" fill="#0f172a">RUNNING</text>
<text x="49" y="179" font-family="sans-serif" font-size="17" fill="#0f172a">Scheduled on one CPU</text>
<rect x="420" y="125" width="260" height="85" rx="8" fill="#fef3c7" stroke="#64748b"/>
<text x="434" y="153" font-family="sans-serif" font-size="17" fill="#0f172a">BLOCKED</text>
<text x="434" y="179" font-family="sans-serif" font-size="17" fill="#0f172a">Not eligible to execute</text>
<rect x="800" y="125" width="265" height="85" rx="8" fill="#ffe4e6" stroke="#64748b"/>
<text x="814" y="153" font-family="sans-serif" font-size="17" fill="#0f172a">RUNNABLE</text>
<text x="814" y="179" font-family="sans-serif" font-size="17" fill="#0f172a">Eligible, not executing</text>
<path d="M295 166 L420 166" stroke="#475569" stroke-width="2" fill="none"/>
<polygon points="420,166 410,160 410,172" fill="#475569"/>
<text x="305" y="112" font-family="sans-serif" font-size="15" fill="#0f172a">block</text>
<path d="M680 166 L800 166" stroke="#475569" stroke-width="2" fill="none"/>
<polygon points="800,166 790,160 790,172" fill="#475569"/>
<text x="697" y="112" font-family="sans-serif" font-size="15" fill="#0f172a">wakeup</text>
<path d="M165 210 V270 H932 V210" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M932 235 L932 210" stroke="#475569" stroke-width="2" fill="none"/>
<polygon points="932,210 926,220 938,220" fill="#475569"/>
<text x="365" y="258" font-family="sans-serif" font-size="17" fill="#0f172a">Runnable switch-out → RUNNABLE</text>
<path d="M932 125 V90 H165 V125" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M165 100 L165 125" stroke="#475569" stroke-width="2" fill="none"/>
<polygon points="165,125 159,115 171,115" fill="#475569"/>
<text x="412" y="85" font-family="sans-serif" font-size="16" fill="#0f172a">Switch-in → RUNNING</text>
<rect x="135" y="315" width="830" height="105" rx="8" fill="#e2e8f0" stroke="#64748b"/>
<text x="149" y="343" font-family="sans-serif" font-size="17" fill="#0f172a">Exit: close and retire this task lifetime.</text>
<text x="149" y="369" font-family="sans-serif" font-size="17" fill="#0f172a">Missing events or initial state: retain UNKNOWN, do not invent a wait.</text>
</svg>
