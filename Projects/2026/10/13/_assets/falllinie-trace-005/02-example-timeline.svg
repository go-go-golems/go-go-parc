<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img">
<title>One output scope: 10 ms wall, 3 ms CPU</title><desc>Constructed teaching example; no target scheduler trace was collected</desc>
<rect width="1100" height="470" fill="#f8fafc"/>
<text x="30" y="38" font-family="sans-serif" font-size="25" fill="#0f172a">One output scope: 10 ms wall, 3 ms CPU</text>
<text x="30" y="67" font-family="sans-serif" font-size="15" fill="#475569">Constructed teaching example; no target scheduler trace was collected</text>
<rect x="50" y="125" width="100" height="80" rx="8" fill="#86efac" stroke="#64748b"/>
<text x="64" y="153" font-family="sans-serif" font-size="17" fill="#0f172a">CPU</text>
<rect x="150" y="125" width="400" height="80" rx="8" fill="#fcd34d" stroke="#64748b"/>
<text x="164" y="153" font-family="sans-serif" font-size="17" fill="#0f172a">Blocked: 4 ms</text>
<rect x="550" y="125" width="150.0" height="80" rx="8" fill="#fda4af" stroke="#64748b"/>
<text x="564" y="153" font-family="sans-serif" font-size="17" fill="#0f172a">Runnable</text>
<rect x="700.0" y="125" width="200.0" height="80" rx="8" fill="#86efac" stroke="#64748b"/>
<text x="714.0" y="153" font-family="sans-serif" font-size="17" fill="#0f172a">CPU: 2 ms</text>
<rect x="900.0" y="125" width="150.0" height="80" rx="8" fill="#fda4af" stroke="#64748b"/>
<text x="914.0" y="153" font-family="sans-serif" font-size="17" fill="#0f172a">Runnable</text>
<text x="45" y="235" font-family="sans-serif" font-size="16" fill="#0f172a">0</text>
<text x="145" y="235" font-family="sans-serif" font-size="16" fill="#0f172a">1</text>
<text x="545" y="235" font-family="sans-serif" font-size="16" fill="#0f172a">5</text>
<text x="695.0" y="235" font-family="sans-serif" font-size="16" fill="#0f172a">6.5</text>
<text x="895.0" y="235" font-family="sans-serif" font-size="16" fill="#0f172a">8.5</text>
<text x="1045" y="235" font-family="sans-serif" font-size="16" fill="#0f172a">10</text>
<text x="45" y="265" font-family="sans-serif" font-size="16" fill="#0f172a">Milliseconds from scope entry</text>
<rect x="130" y="295" width="640" height="65" rx="8" fill="#dbeafe" stroke="#64748b"/>
<text x="144" y="323" font-family="sans-serif" font-size="17" fill="#0f172a">ioctl 0.8–7.2 ms: CPU + blocking + runnable delay</text>
<text x="50" y="405" font-family="sans-serif" font-size="19" fill="#0f172a">Off-CPU = 4 ms blocked + 3 ms runnable; not automatically 7 ms GPU wait.</text>
</svg>
