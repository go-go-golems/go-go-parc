<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img"><title>Frame retirement preserves unread PCM across wrap</title><desc>A deterministic eight-frame example matching the transport test. A partial callback keeps the five unread A frames intact while the producer refills the retired prefix.</desc><rect width="1200" height="590" fill="white"/><g font-family="sans-serif"><text x="32" y="42" font-size="26" fill="#172b3a">Frame retirement preserves unread PCM across wrap</text><text x="35" y="83" font-size="18" fill="#172b3a">Illustrative capacity 8; values label logical stereo frames, not measured playback samples.</text><text x="35" y="155" font-size="20" fill="#172b3a">Publish frames A0..A7</text><rect x="350" y="120" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="362" y="160" font-size="20" fill="#172b3a">A0</text><rect x="448" y="120" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="460" y="160" font-size="20" fill="#172b3a">A1</text><rect x="546" y="120" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="558" y="160" font-size="20" fill="#172b3a">A2</text><rect x="644" y="120" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="656" y="160" font-size="20" fill="#172b3a">A3</text><rect x="742" y="120" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="754" y="160" font-size="20" fill="#172b3a">A4</text><rect x="840" y="120" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="852" y="160" font-size="20" fill="#172b3a">A5</text><rect x="938" y="120" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="950" y="160" font-size="20" fill="#172b3a">A6</text><rect x="1036" y="120" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="1048" y="160" font-size="20" fill="#172b3a">A7</text><text x="35" y="260" font-size="20" fill="#172b3a">Retire first 3 frames</text><rect x="350" y="225" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="362" y="265" font-size="20" fill="#172b3a">free</text><rect x="448" y="225" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="460" y="265" font-size="20" fill="#172b3a">free</text><rect x="546" y="225" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="558" y="265" font-size="20" fill="#172b3a">free</text><rect x="644" y="225" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="656" y="265" font-size="20" fill="#172b3a">A3</text><rect x="742" y="225" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="754" y="265" font-size="20" fill="#172b3a">A4</text><rect x="840" y="225" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="852" y="265" font-size="20" fill="#172b3a">A5</text><rect x="938" y="225" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="950" y="265" font-size="20" fill="#172b3a">A6</text><rect x="1036" y="225" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="1048" y="265" font-size="20" fill="#172b3a">A7</text><text x="35" y="365" font-size="20" fill="#172b3a">Refill 3; physical wrap</text><rect x="350" y="330" width="88" height="65" rx="8" fill="#e8f5ed" stroke="#bacbd6"/><text x="362" y="370" font-size="20" fill="#172b3a">B0</text><rect x="448" y="330" width="88" height="65" rx="8" fill="#e8f5ed" stroke="#bacbd6"/><text x="460" y="370" font-size="20" fill="#172b3a">B1</text><rect x="546" y="330" width="88" height="65" rx="8" fill="#e8f5ed" stroke="#bacbd6"/><text x="558" y="370" font-size="20" fill="#172b3a">B2</text><rect x="644" y="330" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="656" y="370" font-size="20" fill="#172b3a">A3</text><rect x="742" y="330" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="754" y="370" font-size="20" fill="#172b3a">A4</text><rect x="840" y="330" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="852" y="370" font-size="20" fill="#172b3a">A5</text><rect x="938" y="330" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="950" y="370" font-size="20" fill="#172b3a">A6</text><rect x="1036" y="330" width="88" height="65" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="1048" y="370" font-size="20" fill="#172b3a">A7</text><text x="35" y="470" font-size="24" fill="#172b3a">Next consumption order: A3, A4, A5, A6, A7, B0, B1, B2.</text><text x="35" y="514" font-size="20" fill="#172b3a">The consumer retires 3 copied frames, not the whole original 8-frame publication.</text><text x="35" y="550" font-size="19" fill="#172b3a">Acquire observes completed writes; release retirement permits overwrite only after copying.</text></g></svg>
