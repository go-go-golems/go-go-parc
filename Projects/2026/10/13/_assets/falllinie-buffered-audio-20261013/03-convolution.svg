<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>Full stereo partitioned convolution, not a reduced response</title><desc>Conceptual computation diagram from Reverb::init/process. The first five of 122 partitions are illustrated; all partitions are retained. Completion-dependent FFT work still occurs at block boundaries.</desc><rect width="1200" height="620" fill="white"/><g font-family="sans-serif"><text x="32" y="42" font-size="26" fill="#172b3a">Full stereo partitioned convolution, not a reduced response</text><text x="35" y="85" font-size="20" fill="#172b3a">Per channel: 2.6-second response = 124800 taps at 48000 Hz = 122 partitions.</text><rect x="35" y="115" width="200" height="70" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="47" y="155" font-size="18" fill="#172b3a">h[0] : 1024 taps</text><rect x="255" y="115" width="200" height="70" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="267" y="155" font-size="18" fill="#172b3a">h[1] : 1024 taps</text><rect x="475" y="115" width="200" height="70" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="487" y="155" font-size="18" fill="#172b3a">h[2] : 1024 taps</text><rect x="695" y="115" width="200" height="70" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="707" y="155" font-size="18" fill="#172b3a">h[3] : 1024 taps</text><rect x="915" y="115" width="200" height="70" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="927" y="155" font-size="18" fill="#172b3a">h[4] : 1024 taps</text><text x="40" y="221" font-size="20" fill="#172b3a">Each partition: zero-pad to 2048 → FFT → retain 1025 independent real-signal bins.</text><rect x="35" y="250" width="510" height="108" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="50" y="284" font-size="23" fill="#172b3a">Completed-history partitions 1..121</text><text x="50" y="320" font-size="19" fill="#172b3a">Multiply-accumulate across 64-sample groups</text><rect x="630" y="250" width="530" height="108" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="645" y="284" font-size="23" fill="#172b3a">At input-block completion</text><text x="645" y="320" font-size="19" fill="#172b3a">Current FFT + partition 0 + inverse FFT</text><line x1="290" y1="358" x2="290" y2="398" stroke="#566675" stroke-width="2"/><line x1="890" y1="358" x2="890" y2="398" stroke="#566675" stroke-width="2"/><line x1="290" y1="398" x2="890" y2="398" stroke="#566675" stroke-width="2"/><rect x="200" y="430" width="790" height="100" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="218" y="465" font-size="22" fill="#172b3a">Reconstruct conjugate spectrum → inverse FFT → overlap-add</text><text x="218" y="503" font-size="18" fill="#172b3a">Emit stored wet output with one explicit 1024-sample partition delay</text><text x="35" y="580" font-size="20" fill="#172b3a">Numerical path is unchanged by buffering; this is two independent stereo convolutions.</text></g></svg>
