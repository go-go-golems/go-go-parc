<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>Callback computation moved to the producer</title><desc>Grouped horizontal timing chart in milliseconds. Wall and calling-thread CPU are separately recorded means and maxima. The producer retains substantial computation; buffered callback cost is small. No paired per-block scheduling trace is inferred.</desc><rect width="1200" height="620" fill="white"/><g font-family="sans-serif"><text x="32" y="42" font-size="26" fill="#172b3a">Callback computation moved to the producer</text><text x="35" y="85" font-size="19" fill="#172b3a">PulseAudio backend; 48000 Hz / 1024 frames; 120 seconds per mode, direct first.</text><text x="35" y="112" font-size="17" fill="#172b3a">Matched configuration, not identical live inputs. Max wall and max CPU are independent aggregates.</text><text x="35" y="184" font-size="20" fill="#172b3a">Direct callback</text><text x="250" y="184" font-size="18" fill="#1769aa">wall</text><rect x="365" y="165" width="282.348828125" height="20" fill="#1769aa"/><line x1="910.5734375" y1="161" x2="910.5734375" y2="190" stroke="#1769aa" stroke-width="2"/><text x="1080" y="182" font-size="17" fill="#1769aa">12.907</text><text x="250" y="220" font-size="18" fill="#16835c">CPU</text><rect x="365" y="201" width="248.5063875" height="20" fill="#16835c"/><line x1="814.691615625" y1="197" x2="814.691615625" y2="226" stroke="#16835c" stroke-width="2"/><text x="1080" y="218" font-size="17" fill="#16835c">11.360</text><text x="365" y="250" font-size="16" fill="#172b3a">max wall 24.941 ms; max CPU 20.557 ms</text><text x="35" y="294" font-size="20" fill="#172b3a">Buffered callback</text><text x="250" y="294" font-size="18" fill="#1769aa">wall</text><rect x="365" y="275" width="0.50238125" height="20" fill="#1769aa"/><line x1="400.21875" y1="271" x2="400.21875" y2="300" stroke="#1769aa" stroke-width="2"/><text x="1080" y="292" font-size="17" fill="#1769aa">0.023</text><text x="250" y="330" font-size="18" fill="#16835c">CPU</text><rect x="365" y="311" width="0.288246875" height="20" fill="#16835c"/><line x1="366.4546875" y1="307" x2="366.4546875" y2="336" stroke="#16835c" stroke-width="2"/><text x="1080" y="328" font-size="17" fill="#16835c">0.013</text><text x="365" y="360" font-size="16" fill="#172b3a">max wall 1.610 ms; max CPU 0.067 ms</text><text x="35" y="404" font-size="20" fill="#172b3a">Buffered producer</text><text x="250" y="404" font-size="18" fill="#1769aa">wall</text><rect x="365" y="385" width="279.25290312500005" height="20" fill="#1769aa"/><line x1="956.4825000000001" y1="381" x2="956.4825000000001" y2="410" stroke="#1769aa" stroke-width="2"/><text x="1080" y="402" font-size="17" fill="#1769aa">12.766</text><text x="250" y="440" font-size="18" fill="#16835c">CPU</text><rect x="365" y="421" width="247.04774062500002" height="20" fill="#16835c"/><line x1="838.6365593749999" y1="417" x2="838.6365593749999" y2="446" stroke="#16835c" stroke-width="2"/><text x="1080" y="438" font-size="17" fill="#16835c">11.294</text><text x="365" y="470" font-size="16" fill="#172b3a">max wall 27.039 ms; max CPU 21.652 ms</text><line x1="365.0" y1="492" x2="365.0" y2="502" stroke="#566675" stroke-width="2"/><text x="357.0" y="526" font-size="16" fill="#172b3a">0</text><line x1="474.375" y1="492" x2="474.375" y2="502" stroke="#566675" stroke-width="2"/><text x="466.375" y="526" font-size="16" fill="#172b3a">5</text><line x1="583.75" y1="492" x2="583.75" y2="502" stroke="#566675" stroke-width="2"/><text x="575.75" y="526" font-size="16" fill="#172b3a">10</text><line x1="693.125" y1="492" x2="693.125" y2="502" stroke="#566675" stroke-width="2"/><text x="685.125" y="526" font-size="16" fill="#172b3a">15</text><line x1="802.5" y1="492" x2="802.5" y2="502" stroke="#566675" stroke-width="2"/><text x="794.5" y="526" font-size="16" fill="#172b3a">20</text><line x1="911.875" y1="492" x2="911.875" y2="502" stroke="#566675" stroke-width="2"/><text