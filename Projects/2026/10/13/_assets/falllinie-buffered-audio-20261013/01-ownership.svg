<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>One live DSP owner; one PCM producer and consumer</title><desc>Current implementation ownership. SDL and GL video calls stay on main. Direct and offline modes are mutually exclusive with the buffered worker.</desc><rect width="1200" height="620" fill="white"/><g font-family="sans-serif"><text x="32" y="42" font-size="26" fill="#172b3a">One live DSP owner; one PCM producer and consumer</text><rect x="35" y="100" width="265" height="170" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="50" y="132" font-size="23" fill="#172b3a">Main thread</text><text x="50" y="167" font-size="18" fill="#172b3a">Input + simulation</text><text x="50" y="196" font-size="18" fill="#172b3a">Numeric command producer</text><text x="50" y="225" font-size="18" fill="#172b3a">SDL lifetime; video + GL</text><rect x="410" y="100" width="310" height="170" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="425" y="132" font-size="23" fill="#172b3a">DSP worker</text><text x="425" y="167" font-size="18" fill="#172b3a">Command consumer</text><text x="425" y="196" font-size="18" fill="#172b3a">Sole live musical state</text><text x="425" y="225" font-size="18" fill="#172b3a">Render 1024-frame blocks</text><rect x="820" y="100" width="340" height="170" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="835" y="132" font-size="23" fill="#172b3a">SDL callback</text><text x="835" y="167" font-size="18" fill="#172b3a">PCM consumer</text><text x="835" y="196" font-size="18" fill="#172b3a">Copy + silence + counters</text><text x="835" y="225" font-size="18" fill="#172b3a">No DSP or producer wake</text><rect x="410" y="345" width="310" height="155" rx="8" fill="#edf4fa" stroke="#bacbd6"/><text x="425" y="377" font-size="23" fill="#172b3a">PCM frame ring</text><text x="425" y="412" font-size="18" fill="#172b3a">Capacity 8192 stereo frames</text><text x="425" y="441" font-size="18" fill="#172b3a">Target 2048 at request 1024</text><text x="425" y="470" font-size="18" fill="#172b3a">Release/acquire cursors</text><line x1="300" y1="170" x2="410" y2="170" stroke="#566675" stroke-width="2"/><path d="M 402,165 L 410,170 L 402,175" fill="none" stroke="#566675" stroke-width="2"/><text x="307" y="147" font-size="15" fill="#172b3a">commands</text><line x1="565" y1="270" x2="565" y2="345" stroke="#566675" stroke-width="2"/><text x="575" y="305" font-size="17" fill="#172b3a">publish</text><line x1="720" y1="415" x2="990" y2="415" stroke="#566675" stroke-width="2"/><path d="M 982,410 L 990,415 L 982,420" fill="none" stroke="#566675" stroke-width="2"/><line x1="990" y1="415" x2="990" y2="270" stroke="#566675" stroke-width="2"/><text x="825" y="402" font-size="17" fill="#172b3a">retire after copy</text><text x="35" y="552" font-size="20" fill="#172b3a">Buffered ownership shown. Direct mode excludes the worker; offline excludes both live owners.</text><text x="35" y="584" font-size="18" fill="#172b3a">A thread owns state, not a physical core. No affinity or real-time scheduling policy was changed.</text></g></svg>
