<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550"><rect width="1040" height="550" fill="#faf9f6"/><g font-family="sans-serif" fill="#182a37">
<text x="24" y="35" font-size="23">Scene/post sensitivity: deliberately non-parity shader substitutions</text>
<text x="24" y="64" font-size="14">Same binary, 600-frame replay, dual 512×384, no audio; two cases per mode; no production change.</text>
<text x="200" y="103" font-size="16">Pooled mean / p95 frame interval</text>
<text x="24" y="156" font-size="16">baseline</text>
<rect x="200" y="136" width="209.56" height="27" fill="#777"/>
<path d="M498.28654355555557 132 v35" stroke="#222" stroke-width="3"/>
<text x="200" y="184" font-size="13">mean 23.575 ms; p95 33.557 ms</text>
<text x="24" y="232" font-size="16">post-copy</text>
<rect x="200" y="212" width="171.60" height="27" fill="#c18133"/>
<path d="M463.41478133333334 208 v35" stroke="#222" stroke-width="3"/>
<text x="200" y="260" font-size="13">mean 19.305 ms; p95 29.634 ms</text>
<text x="24" y="308" font-size="16">scene-flat</text>
<rect x="200" y="288" width="148.73" height="27" fill="#2984ad"/>
<path d="M362.5772284444445 284 v35" stroke="#222" stroke-width="3"/>
<text x="200" y="336" font-size="13">mean 16.733 ms; p95 18.290 ms</text>
<text x="24" y="384" font-size="16">both</text>
<rect x="200" y="364" width="147.74" height="27" fill="#8b65aa"/>
<path d="M379.7536457777778 360 v35" stroke="#222" stroke-width="3"/>
<text x="200" y="412" font-size="13">mean 16.621 ms; p95 20.222 ms</text>
<text x="640" y="103" font-size="16">Fragment activity, host-window rate</text>
<rect x="640" y="136" width="285.09" height="27" fill="#777"/>
<text x="640" y="184" font-size="13">801.80 Mcycles/s</text>
<rect x="640" y="212" width="285.26" height="27" fill="#c18133"/>
<text x="640" y="260" font-size="13">802.29 Mcycles/s</text>
<rect x="640" y="288" width="282.14" height="27" fill="#2984ad"/>
<text x="640" y="336" font-size="13">793.53 Mcycles/s</text>
<rect x="640" y="364" width="187.83" height="27" fill="#8b65aa"/>
<text x="640" y="412" font-size="13">528.28 Mcycles/s</text>
<text x="24" y="477" font-size="14">Frame savings are not independent pass costs. Image content, linking and driver work can change.</text>
<text x="24" y="505" font-size="14">Combined substitution reduces activity without much further mean-time gain; p95 is not monotonic.</text>
<text x="24" y="530" font-size="13">Whole-device counters include compositor work and use approximate host intervals, not calibrated utilization.</text></g></svg>
