<!doctype html><meta charset="utf-8"><title>Educational archive MSE experiment</title>
<h1>Archive MSE experiment</h1><video width="640" height="360" muted playsinline></video>
<script>
window.exercise = async function () {
 const video=document.querySelector('video'), trace=[];
 const record=(kind,data={})=>trace.push({kind,...data});
 const once=(target,event)=>new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>{cleanup();reject(Error('timeout: '+event));},8000);
  const good=e=>{cleanup();resolve(e)},bad=()=>{cleanup();reject(Error('media error'))};
  function cleanup(){clearTimeout(timer);target.removeEventListener(event,good);target.removeEventListener('error',bad)}
  target.addEventListener(event,good,{once:true});target.addEventListener('error',bad,{once:true});
 });
 async function fetchBytes(url){const response=await fetch(url);if(!response.ok)throw Error('fetch '+response.status);
  const bytes=await response.arrayBuffer();if(bytes.byteLength>4*1024*1024)throw Error('body admission');
  const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(x=>x.toString(16).padStart(2,'0')).join('');
  record('fetched',{url,bytes:bytes.byteLength,sha256:hash});return bytes;}
 const playlist=new TextDecoder().decode(await fetchBytes('/presentation.m3u8'));
 const index=await (await fetch('/index.json')).json();
 const names=playlist.split('\n').filter(x=>x&&!x.startsWith('#'));
 if(names.length!==3||!playlist.includes('#EXT-X-DISCONTINUITY'))throw Error('fixture playlist');
 const dates=[...playlist.matchAll(/#EXT-X-PROGRAM-DATE-TIME:([^\n]+)/g)].map(x=>Date.parse(x[1]));
 if(dates.length!==3||dates.some(x=>!Number.isFinite(x)))throw Error('PDT fixture');
 const init=await fetchBytes('/init.mp4'), raw=new Uint8Array(init);
 let position=-1;for(let i=0;i<raw.length-8;i++)if(String.fromCharCode(...raw.slice(i,i+4))==='avcC'){position=i;break}
 if(position<0)throw Error('missing AVC config');
 const codec='avc1.'+[...raw.slice(position+5,position+8)].map(x=>x.toString(16).padStart(2,'0')).join('');
 const mime='video/mp4; codecs="'+codec+'"';
 if(!MediaSource.isTypeSupported(mime))throw Error('unsupported '+mime);
 const media=new MediaSource(), url=URL.createObjectURL(media);video.src=url;
 await once(media,'sourceopen');record('sourceopen',{mime});
 const source=media.addSourceBuffer(mime);
 const ranges=()=>Array.from({length:source.buffered.length},(_,i)=>[source.buffered.start(i),source.buffered.end(i)]);
 async function append(bytes,label){if(source.updating)throw Error('overlapping append');
  const ended=once(source,'updateend');record('append',{label,offset:source.timestampOffset,bytes:bytes.byteLength});
  source.appendBuffer(bytes);await ended;record('updateend',{label,ranges:ranges()});}
 await append(init,'initialization');
 for(let i=0;i<names.length;i++){
  // Restricted fixture adapter reads one explicit PDT per fragment.
  // General HLS parsing, adaptation and transmuxing are intentionally not implemented.
  const declared=(dates[i]-dates[0])/1000,original=index.segments[i].pts_anchor/index.segments[i].timescale;
  source.timestampOffset=declared-original;
  await append(await fetchBytes('/'+names[i]),names[i]);
 }
 const buffered=ranges();if(buffered.length!==2||Math.abs(buffered[1][0]-4)>.01)throw Error('missing gap');
 async function seekAndObserve(target){
  const frame=new Promise((resolve,reject)=>{let id;const timer=setTimeout(()=>{video.cancelVideoFrameCallback(id);reject(Error('frame timeout'));},8000);
   const callback=(now,metadata)=>{if(Math.abs(metadata.mediaTime-target)>.11){id=video.requestVideoFrameCallback(callback);return}
    clearTimeout(timer);resolve({mediaTime:metadata.mediaTime,presentedFrames:metadata.presentedFrames});};id=video.requestVideoFrameCallback(callback);});
  const sought=once(video,'seeked');video.currentTime=target;await sought;record('seeked',{target,currentTime:video.currentTime});
  await video.play();const observed=await frame;video.pause();record('frame',{target,...observed});return observed;
 }
 const first=await seekAndObserve(.8);
 const gapTarget=3;if(buffered.some(([a,b])=>a<=gapTarget&&gapTarget<b))throw Error('gap unexpectedly buffered');
 record('gap-rejected',{target:gapTarget});
 const after=await seekAndObserve(4.8);
 const removed=once(source,'updateend');source.remove(0,2);await removed;record('removed',{ranges:ranges()});
 media.endOfStream();record('endOfStream');
 const canvas=document.createElement('canvas');canvas.width=160;canvas.height=90;canvas.getContext('2d').drawImage(video,0,0,160,90);
 const image=canvas.toDataURL('image/png');
 const closed=once(media,'sourceclose');
 video.pause();video.removeAttribute('src');video.load();URL.revokeObjectURL(url);video.remove();await closed;
 record('cleanup',{videoElements:document.querySelectorAll('video').length,mediaState:media.readyState,sourceBuffers:media.sourceBuffers.length});
 return {kind:'executed-browser-MSE',codec,buffered,first,after,trace,image};
};
</script>
