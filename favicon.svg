<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Black field -->
  <rect width="32" height="32" fill="#000"/>
  <!-- Hex frame -->
  <polygon points="16,2 28,8 28,24 16,30 4,24 4,8" fill="none" stroke="#FFF" stroke-width="1.5"/>
  <!-- Head -->
  <polygon points="10,6 22,6 24,10 22,14 10,14 8,10" fill="#FFF"/>
  <!-- Eyes -->
  <rect x="11" y="8" width="4" height="3" fill="#000"/>
  <rect x="17" y="8" width="4" height="3" fill="#000"/>
  <!-- Body -->
  <rect x="9" y="15" width="14" height="9" fill="#FFF"/>
  <!-- Chest void with G -->
  <rect x="12" y="17" width="8" height="5" fill="#000"/>
  <rect x="13" y="18" width="6" height="1" fill="#FFF"/>
  <rect x="13" y="19" width="2" height="2" fill="#FFF"/>
  <rect x="15" y="20" width="4" height="1" fill="#FFF"/>
  <!-- Ground -->
  <rect x="5" y="25" width="22" height="1" fill="#FFF"/>
</svg>
