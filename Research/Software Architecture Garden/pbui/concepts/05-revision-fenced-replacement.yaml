briefing:
  label: INTERN BRIEFING 05
  headline: THE REVISION FENCE
  file: client.ts:413-453 · useRemoteWorkbench.ts
  sections:
    - label: WHY IT EXISTS
      text: >-
        Two tabs, one workbench. Without a fence the slower tab's save silently
        overwrites the faster tab's work. So every write states which revision
        it believed it was editing, and the host is meant to refuse it if that
        belief is stale.
    - label: WHAT THE BROWSER SENDS
      code:
        - "'If-Match': workbenchETag(id, revision)"
        - "'Idempotency-Key': requestId"
        - "body: toJson(WorkbenchDocumentSchema, doc)"
    - label: WHERE THE REVISION LIVES
      text: >-
        As an exact bigint in a ref, outside Redux, because JSON numbers would
        round it. A response for a different workbench ID is rejected rather
        than applied, and switching workbench resets the whole epoch so old
        callbacks cannot publish (useRemoteWorkbench.ts:42-100).
    - label: RETRY IDENTITY
      code:
        - "fingerprint = JSON.stringify(docJSON)"
        - "if (pending.fingerprint === current)"
        - "  reuse pending.id   // same request"
        - "else id = crypto.randomUUID()"
      text: >-
        Retrying the same local state reuses one request ID, so a retry is the
        same request rather than a second one.
    - label: WHAT IS NOT HERE
      text: >-
        The comparison itself. No CAS, no revision increment, no key-to-body
        binding, no audit, no authorization, no storage. All of that belongs to
        a host outside this repository, and none of it is audited by this study.
    - label: TRAP
      text: >-
        JSON.stringify is not canonical identity — key order decides it, so
        treat it as a local change detector only. And a revision is not an event
        ordinal: SSE gives invalidate-and-refetch, never replay.
