- id: revision-fenced-replacement-note
  type: text
  data:
    text: JSON.stringify is a local fingerprint, not canonical semantic identity. Even an increment of exactly one is not proved here.
    preset: body
  style:
    font: '''DejaVu Sans'', sans-serif'
    textCase: none
