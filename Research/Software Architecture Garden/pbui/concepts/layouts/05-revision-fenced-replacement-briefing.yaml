almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
- id: revision-fenced-replacement-b-band
  type: banner
  data:
    text: INTERN BRIEFING 05
    pad: m
- id: revision-fenced-replacement-b-title
  type: title
  data:
    text: THE REVISION FENCE
    subtitle: client.ts:413-453 · useRemoteWorkbench.ts
- id: revision-fenced-replacement-b0-rule
  type: rule
  data:
    weight: thick
- id: revision-fenced-replacement-b0-label
  type: text
  data:
    text: WHY IT EXISTS
    preset: micro
- id: revision-fenced-replacement-b0-text
  type: text
  data:
    text: Two tabs, one workbench. Without a fence the slower tab's save silently overwrites the faster tab's work. So every write states which revision it believed it was editing, and the host is meant to refuse it if that belief is stale.
    preset: body
  style:
    textCase: none
- id: revision-fenced-replacement-b1-rule
  type: rule
  data:
    weight: thick
- id: revision-fenced-replacement-b1-label
  type: text
  data:
    text: WHAT THE BROWSER SENDS
    preset: micro
- id: revision-fenced-replacement-b1-code-0
  type: text
  data:
    text: '''If-Match'': workbenchETag(id, revision)'
    preset: small
  style:
    font: '''DejaVu Sans Mono'', monospace'
    textCase: none
    weight: 700
    size: 10
- id: revision-fenced-replacement-b1-code-1
  type: text
  data:
    text: '''Idempotency-Key'': requestId'
    preset: small
  style:
    font: '''DejaVu Sans Mono'', monospace'
