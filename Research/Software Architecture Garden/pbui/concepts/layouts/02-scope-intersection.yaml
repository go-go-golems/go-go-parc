    preset: micro
- id: scope-intersection-disc
  type: table
  data:
    cols:
    - label: IT IS
      w: 1fr
    - label: IT IS NOT
      w: 1fr
    rows:
    - - a picker filter
      - authorization
    - - order preserving
      - a mount gate
    - - monotone
      - a tenant policy
- id: scope-intersection-vocab
  type: kv
  data:
    items:
    - - LOCAL
      - AppScope, useAvailableApps
    - - AS A PATTERN
      - presentation policy scope
    - - ELSEWHERE
      - feature flag, capability filter
