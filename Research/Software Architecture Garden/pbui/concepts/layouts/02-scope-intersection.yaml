almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
- id: scope-intersection-title
  type: title
  data:
    text: SCOPE INTERSECTION
    subtitle: Concept 02 · offered is not allowed
- id: scope-intersection-sym-label
  type: text
  data:
    text: SYMBOLS
    preset: micro
- id: scope-intersection-sym
  type: table
  data:
    cols:
    - label: SYM
      w: 78
    - label: MEANING
      w: 1fr
    rows:
    - - U
      - registered app IDs
    - - I
      - instance allow-set
    - - S
      - stage allow-set
    - - Q
      - workspace allow-set
- id: scope-intersection-law
  type: banner
  data:
    text: Offered = I ∩ S ∩ Q
    pad: m
  style:
    font: '''DejaVu Sans'', sans-serif'
    textCase: none
- id: scope-intersection-law2
  type: text
  data:
    text: X ⊆ Y ⇒ X∩Z ⊆ Y∩Z
    preset: body
    align: center
  style:
    font: '''DejaVu Sans'', sans-serif'
    textCase: none
- id: scope-intersection-disc-label
