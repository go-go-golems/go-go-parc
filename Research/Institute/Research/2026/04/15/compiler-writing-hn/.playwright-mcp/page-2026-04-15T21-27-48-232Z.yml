                    - img [ref=e746]
                  - generic [ref=e750]:
                    - paragraph [ref=e751]:
                      - text: Below the surface, OMeta, Racket’s
                      - code [ref=e752]: "#lang"
                      - text: ", and language workbenches such as JetBrains MPS are all pushing the same idea: a programming language is not just a fixed syntax accepted by a fixed compiler. It is a configurable interface between human notation, program structure, static reasoning, execution, and tools. They differ in where they place the leverage point—OMeta in generalized parsing/pattern matching, Racket in module- and macro-level language construction, and MPS in model-first editing and tooling—but all three weaken the classical boundary between “the language” and “the compiler.”"
                      - link "Tin Lizzie +2 CCS Northeastern University +2" [ref=e755] [cursor=pointer]:
