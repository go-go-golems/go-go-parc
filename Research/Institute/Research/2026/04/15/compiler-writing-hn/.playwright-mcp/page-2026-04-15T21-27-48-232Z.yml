                - generic [ref=e734]:
                  - paragraph [ref=e738]: I’m pulling primary sources for each system first, then I’ll synthesize the comparison around architecture, tooling, and the language/compiler boundary. If you want a particular angle emphasized—history, implementation mechanics, or design philosophy—say so while I’m working.
