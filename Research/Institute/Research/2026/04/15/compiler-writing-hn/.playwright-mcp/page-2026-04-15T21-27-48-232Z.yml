                            - generic [ref=e778]: "+3"
                    - paragraph [ref=e779]:
                      - text: That matters because it lets OMeta collapse several traditionally separate compiler tasks into one notation. The paper explicitly frames OMeta as useful for tokenizers, parsers, visitors, and tree transformers, and it shows grammars that flatten lists, mix scannerful and scannerless idioms, and define higher-order productions via
                      - code [ref=e780]: apply
                      - text: ". In a conventional compiler, those would usually be separate components written in different styles: regex lexer, grammar formalism, AST visitor classes, ad hoc tree rewriters. In OMeta, they become instances of one generalized pattern language."
