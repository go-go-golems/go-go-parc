                    - 'heading "1) OMeta: PEGs generalized into a language workbench for matching and transformation" [level=2] [ref=e763]'
                    - paragraph [ref=e764]:
                      - text: OMeta starts from Parsing Expression Grammars, but it does not stop at text parsing. Warth and Piumarta describe it as a generalization of PEGs that handles arbitrary data rather than only character streams, and that supports parameterized and higher-order productions. Concretely, OMeta extends the universe of matchable inputs from characters to strings, numbers, atoms, and lists; it also supports nested list patterns, so the same matching formalism can operate over parse trees and other structured objects, not just source text. The built-in
                      - code [ref=e765]: _
                      - text: production consumes one element of the input stream, which makes the “stream” abstraction generic rather than text-specific.
                      - link "Tin Lizzie +3 Tin Lizzie +3 Tin Lizzie +3" [ref=e768] [cursor=pointer]:
