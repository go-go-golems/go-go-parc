                            - generic [ref=e790]: "+3"
                          - generic [ref=e791]:
                            - generic [ref=e792]: Tin Lizzie
                            - generic [ref=e793]: "+3"
                    - paragraph [ref=e794]:
                      - text: The “O” in OMeta is not cosmetic. OMeta grammars are classes; they can inherit, override productions, and use
                      - code [ref=e795]: <super ...>
                      - text: "analogously to OO method dispatch. The implementation itself uses OMeta for OMeta: the parser translates productions into parse trees, then the compiler transforms those trees into executable code, and optimization passes are themselves written in OMeta using visitor-like grammars. It also supports foreign production invocation, which lets one grammar lend its input stream to another and thereby compose multiple grammars without name clashes. So OMeta is not merely a parser formalism; it is a meta-compilational substrate in which language definition, transformation, and extension are expressed in the same medium."
                      - link "Tin Lizzie +3 Tin Lizzie +3 Tin Lizzie +3" [ref=e798] [cursor=pointer]:
                        - /url: https://tinlizzie.org/~awarth/papers/dls07.pdf
                        - generic [ref=e799]:
                          - generic [ref=e800]:
                            - generic [ref=e801]: Tin Lizzie
                            - generic [ref=e802]: "+3"
                          - generic [ref=e803]:
                            - generic [ref=e804]: Tin Lizzie
                            - generic [ref=e805]: "+3"
                          - generic [ref=e806]:
                            - generic [ref=e807]: Tin Lizzie
                            - generic [ref=e808]: "+3"
                    - paragraph [ref=e809]:
                      - text: "Its trade-offs are the ones you would expect from this unification. Semantic actions are powerful, but OMeta does not roll them back on backtracking, so stateful grammars require care. Memoization is optional rather than doctrinal: the authors note that packrat-style guarantees are attractive, but memoization overhead can outweigh benefits when backtracking is limited. OMeta also gains extensibility through inheritance and dynamic composition, but the paper notes the absence of multiple inheritance and the need for mechanisms such as foreign production invocation to avoid code duplication and clashes. In other words, OMeta buys conceptual unity at the price of some semantic subtlety and less separation between pure recognition and effectful execution."
                      - link "Tin Lizzie +4 Tin Lizzie +4 Tin Lizzie +4" [ref=e812] [cursor=pointer]:
                        - /url: https://tinlizzie.org/~awarth/papers/dls07.pdf
                        - generic [ref=e813]:
                          - generic [ref=e814]:
                            - generic [ref=e815]: Tin Lizzie
                            - generic [ref=e816]: "+4"
                          - generic [ref=e817]:
                            - generic [ref=e818]: Tin Lizzie
                            - generic [ref=e819]: "+4"
                          - generic [ref=e820]:
                            - generic [ref=e821]: Tin Lizzie
                            - generic [ref=e822]: "+4"
                    - 'heading "2) Racket #lang: language-oriented programming through modules and libraries" [level=2] [ref=e823]':
                      - generic [ref=e824]:
                        - text: 2) Racket
                        - code [ref=e825]: "#lang"
                        - text: ": language-oriented programming through modules and libraries"
                    - paragraph [ref=e826]:
                      - text: "Racket’s move is different. Instead of generalizing the parser into a pattern language, it generalizes the host language into a language-building platform. In the Racket Guide, a module’s initial import is its “module language,” and Racket allows programmers to define their own module languages. The reader system makes this operational:"
                      - code [ref=e827]: "#lang s-exp"
                      - text: turns the following module path into the language of a generated module, and
                      - code [ref=e828]: "#lang reader"
                      - text: generalizes the path resolution for reader extensions. So
                      - code [ref=e829]: "#lang"
                      - text: is not just a file header; it is the entry point into per-module language selection.
                      - link "Racket Documentation +1" [ref=e832] [cursor=pointer]:
                        - /url: https://docs.racket-lang.org/guide/module-languages.html
                        - generic [ref=e834]:
                          - generic [ref=e835]: Racket Documentation
                          - generic [ref=e836]: "+1"
                    - paragraph [ref=e837]:
                      - text: "The deeper claim comes from the Racket papers. “Languages as Libraries” says the key design is to make language choice specific to each module, with each language implementation having complete control over the syntax and semantics of that module. The same paper says Racket exposes extension mechanisms for all phases of language implementation: notation, AST manipulation, static semantics, module linking, and optimization. In this model, a language is not a separate compiler binary so much as a library-backed module protocol layered on top of a shared runtime, macro system, and toolchain."
                      - link "CCS Northeastern University +1" [ref=e840] [cursor=pointer]:
                        - /url: https://www2.ccs.neu.edu/racket/pubs/pldi11-thacff.pdf
                        - generic [ref=e842]:
                          - generic [ref=e843]: CCS Northeastern University
                          - generic [ref=e844]: "+1"
                    - paragraph [ref=e845]:
                      - text: That is why Racket is often taken as the practical flagship of language-oriented programming. The CACM article defines Racket’s goal as making it easy to create new programming languages and add them to a code base, and it defines “language” broadly as new syntax plus static and dynamic semantics. The same article emphasizes that a language can be created by putting a language-defining module in a file and then using it immediately from another module, without leaving the IDE for external compiler steps. This is not just macro extensibility in the narrow Lisp sense; it is an attempt to make language construction incremental, modular, and routine inside normal development.
                      - link "CCS Northeastern University +2 CCS Northeastern University +2" [ref=e848] [cursor=pointer]:
                        - /url: https://www2.ccs.neu.edu/racket/pubs/fffkbmt-cacm18.pdf
                        - generic [ref=e849]:
                          - generic [ref=e850]:
                            - generic [ref=e851]: CCS Northeastern University
                            - generic [ref=e852]: "+2"
                          - generic [ref=e853]:
                            - generic [ref=e854]: CCS Northeastern University
                            - generic [ref=e855]: "+2"
                    - paragraph [ref=e856]:
                      - text: Racket’s trade-offs are revealing. Its strength is textual, incremental, module-scoped extensibility with deep reuse of host infrastructure. But the same CACM paper says there is a judgment call in deciding when a library should become a language, that conventional syntax support remains less incremental than Lisp-style syntax growth, and that tool support for many user-defined languages remains a hard problem. It also flags security and invariant enforcement as ongoing research areas when many languages coexist inside one ecosystem. So Racket gets closer than most textual systems to “languages as everyday software components,” but it does not make the tooling and semantic governance problems disappear.
                      - link "CCS Northeastern University +3 CCS Northeastern University +3 CCS Northeastern University +3" [ref=e859] [cursor=pointer]:
                        - /url: https://www2.ccs.neu.edu/racket/pubs/fffkbmt-cacm18.pdf
                        - generic [ref=e860]:
                          - generic [ref=e861]:
                            - generic [ref=e862]: CCS Northeastern University
                            - generic [ref=e863]: "+3"
                          - generic [ref=e864]:
                            - generic [ref=e865]: CCS Northeastern University
                            - generic [ref=e866]: "+3"
                          - generic [ref=e867]:
                            - generic [ref=e868]: CCS Northeastern University
                            - generic [ref=e869]: "+3"
                    - 'heading "3) Language workbenches and JetBrains MPS: projectional editing and model-first languages" [level=2] [ref=e870]'
                    - paragraph [ref=e871]:
                      - text: "JetBrains MPS moves the center of gravity again. Its core architectural move is projectional editing: the program is edited directly as an AST rather than as text that later gets parsed. The MPS FAQ states this explicitly: in parser-based approaches, users edit character sequences and a parser constructs an AST; in projectional editing, editing actions modify the AST directly and a projection engine renders some representation for the user. Fowler’s description is philosophically identical: under projectional editing, the abstract representation becomes the core definition of the system, while editable views are projections of it."
                      - link "JetBrains +1" [ref=e874] [cursor=pointer]:
                        - /url: https://www.jetbrains.com/help/mps/mps-faq.html
                        - generic [ref=e876]:
                          - generic [ref=e877]: JetBrains
                          - generic [ref=e878]: "+1"
                    - paragraph [ref=e879]:
                      - text: "This has major consequences. Because the AST is primary, MPS can support notations that are awkward or impossible for parser-based systems: tables, images, diagrams, form-like notations, context-sensitive and positional constructs, and multiple notations over the same underlying program. It can also compose multiple languages in the same artifact without grammar ambiguity, because it is not composing parsers over a shared character stream. MPS documentation and FAQ emphasize exactly these points, and the language-workbench literature treats editor support as a central pillar of the whole approach."
                      - link "JetBrains +2 JetBrains +2" [ref=e882] [cursor=pointer]:
                        - /url: https://www.jetbrains.com/help/mps/mps-faq.html
                        - generic [ref=e883]:
                          - generic [ref=e884]:
                            - generic [ref=e885]: JetBrains
                            - generic [ref=e886]: "+2"
                          - generic [ref=e887]:
                            - generic [ref=e888]: JetBrains
                            - generic [ref=e889]: "+2"
                    - paragraph [ref=e890]:
                      - text: "MPS is not just “an editor without parsing.” It is a full language-definition environment. The editor documentation shows that every concept gets an editor defined in terms of cells and layouts, and the FAQ says MPS supports structure, syntax, type systems, constraints, refactoring, transformation, and code generation in one integrated package. That is the language-workbench idea in concentrated form: a language definition is not complete when its grammar is written; it also includes projections, constraints, analysis, transformations, and IDE behavior."
                      - link "JetBrains +2 JetBrains +2" [ref=e893] [cursor=pointer]:
                        - /url: https://www.jetbrains.com/help/mps/editor.html
                        - generic [ref=e894]:
                          - generic [ref=e895]:
                            - generic [ref=e896]: JetBrains
                            - generic [ref=e897]: "+2"
                          - generic [ref=e898]:
                            - generic [ref=e899]: JetBrains
                            - generic [ref=e900]: "+2"
                    - paragraph [ref=e901]:
                      - text: The trade-off is equally structural. Projectional editing removes grammar ambiguity and enables rich notations, but it changes editing itself. MPS documentation says code in MPS is not text but a projection of the AST, which makes editing more restrictive and creates a learning curve; the editor docs even introduce mechanisms such as two-step deletion because destructive edits can otherwise be hard to predict in a node-based editor. So MPS shifts complexity away from parsing and into interaction design, editor ergonomics, and ecosystem integration.
                      - link "JetBrains +2 JetBrains +2" [ref=e904] [cursor=pointer]:
                        - /url: https://www.jetbrains.com/help/mps/fast-track-to-mps.html
                        - generic [ref=e905]:
                          - generic [ref=e906]:
                            - generic [ref=e907]: JetBrains
                            - generic [ref=e908]: "+2"
                          - generic [ref=e909]:
                            - generic [ref=e910]: JetBrains
                            - generic [ref=e911]: "+2"
                    - heading "4) The philosophical boundary between “language” and “compiler”" [level=2] [ref=e912]
                    - paragraph [ref=e913]: In a traditional view, the language is a specification and the compiler is an implementation artifact that accepts programs in that language. These systems erode that split in different ways.
                    - paragraph [ref=e914]:
                      - text: In OMeta, the grammar formalism is already a programming language, the parser front end produces tree structures that the OMeta compiler transforms, and optimization passes are themselves written in OMeta. The paper even stresses that OMeta is not a parser generator but a programming language whose control structure is based on PEGs. That makes “language definition” and “compiler implementation” different layers of one meta-language rather than separate species of artifact.
                      - link "Tin Lizzie +2 Tin Lizzie +2" [ref=e917] [cursor=pointer]:
                        - /url: https://tinlizzie.org/~awarth/papers/dls07.pdf
                        - generic [ref=e918]:
                          - generic [ref=e919]:
                            - generic [ref=e920]: Tin Lizzie
                            - generic [ref=e921]: "+2"
                          - generic [ref=e922]:
                            - generic [ref=e923]: Tin Lizzie
                            - generic [ref=e924]: "+2"
                    - paragraph [ref=e925]:
                      - text: In Racket, the boundary shifts from “specification versus implementation” to “language as packaged implementation.” A language is a module-scoped choice of reader, bindings, syntax, static analysis, and dynamic behavior. The papers explicitly define language in terms of syntax plus static and dynamic semantics, while also presenting language implementations as libraries that supplement the existing compiler. So in Racket, the compiler is less a monolith than a host substrate exposing extension points; a language is whatever occupies those extension points coherently.
                      - link "CCS Northeastern University +2 CCS Northeastern University +2" [ref=e928] [cursor=pointer]:
                        - /url: https://www2.ccs.neu.edu/racket/pubs/fffkbmt-cacm18.pdf
                        - generic [ref=e929]:
                          - generic [ref=e930]:
                            - generic [ref=e931]: CCS Northeastern University
                            - generic [ref=e932]: "+2"
                          - generic [ref=e933]:
                            - generic [ref=e934]: CCS Northeastern University
                            - generic [ref=e935]: "+2"
                    - paragraph [ref=e936]:
                      - text: In MPS, the split is challenged even more radically because the parser ceases to be central. A language definition includes structure, editor projections, constraints, type systems, refactorings, and generators. The compiler becomes only one semantics-producing aspect among several. From this angle, the compiler is not the unique implementation of a language; it is one consumer of a richer language model that also drives editing, validation, and refactoring.
                      - link "JetBrains +2 JetBrains +2" [ref=e939] [cursor=pointer]:
                        - /url: https://www.jetbrains.com/help/mps/mps-faq.html
                        - generic [ref=e940]:
                          - generic [ref=e941]:
                            - generic [ref=e942]: JetBrains
                            - generic [ref=e943]: "+2"
                          - generic [ref=e944]:
                            - generic [ref=e945]: JetBrains
                            - generic [ref=e946]: "+2"
                    - paragraph [ref=e947]:
                      - text: "So the cleanest philosophical summary is this: OMeta treats the compiler as a specialized program in a generalized matching language; Racket treats the compiler as a reusable host platform for languages-as-modules; MPS treats compilation as one projection/translation of a model whose primary life is not textual source code at all. Each view weakens the classical idea that a language exists first and a compiler merely follows it."
                      - link "JetBrains +3 Tin Lizzie +3 CCS Northeastern University +3" [ref=e950] [cursor=pointer]:
                        - /url: https://tinlizzie.org/~awarth/papers/dls07.pdf
                        - generic [ref=e951]:
                          - generic [ref=e952]:
                            - generic [ref=e953]: JetBrains
                            - generic [ref=e954]: "+3"
                          - generic [ref=e955]:
                            - generic [ref=e956]: Tin Lizzie
                            - generic [ref=e957]: "+3"
                          - generic [ref=e958]:
                            - generic [ref=e959]: CCS Northeastern University
                            - generic [ref=e960]: "+3"
                    - heading "5) How these approaches challenge traditional compiler architecture" [level=2] [ref=e961]
                    - paragraph [ref=e962]:
                      - text: "Traditional compiler architecture assumes a privileged source form—usually text—followed by a fairly linear sequence: lexing, parsing, AST construction, semantic analysis, optimization, code generation. OMeta, Racket, and MPS each attack a different assumption in that pipeline. OMeta collapses lexer, parser, visitor, and transformer into one pattern-matching framework over arbitrary objects. Racket preserves text but makes every module choose its own language and exposes multiple implementation phases as extension APIs. MPS removes parsing from the center by making the model primary and the editor a projection of that model."
                      - link "martinfowler.com +3 Tin Lizzie +3 CCS Northeastern University +3" [ref=e965] [cursor=pointer]:
                        - /url: https://tinlizzie.org/~awarth/papers/dls07.pdf
                        - generic [ref=e966]:
                          - generic [ref=e967]:
                            - generic [ref=e968]: martinfowler.com
                            - generic [ref=e969]: "+3"
                          - generic [ref=e970]:
                            - generic [ref=e971]: Tin Lizzie
                            - generic [ref=e972]: "+3"
                          - generic [ref=e973]:
                            - generic [ref=e974]: CCS Northeastern University
                            - generic [ref=e975]: "+3"
                    - paragraph [ref=e976]:
                      - text: The shared challenge to orthodoxy is that compiler architecture stops being a single pipeline and becomes a composition framework. In OMeta, the key reusable unit is the grammar/object matcher. In Racket, it is the module language built atop macros, readers, and host runtime. In MPS, it is the metamodel plus editor/type/generator aspects. The result is less emphasis on a one-way translation from source to executable and more emphasis on reusable representations and transformations that sit between human-facing notation and machine execution.
                      - link "CWI Homepages +3 Tin Lizzie +3 CCS Northeastern University +3" [ref=e979] [cursor=pointer]:
                        - /url: https://tinlizzie.org/~awarth/papers/dls07.pdf
                        - generic [ref=e980]:
                          - generic [ref=e981]:
                            - generic [ref=e982]: CWI Homepages
                            - generic [ref=e983]: "+3"
                          - generic [ref=e984]:
                            - generic [ref=e985]: Tin Lizzie
                            - generic [ref=e986]: "+3"
                          - generic [ref=e987]:
                            - generic [ref=e988]: CCS Northeastern University
                            - generic [ref=e989]: "+3"
                    - heading "Contrast and trade-offs" [level=2] [ref=e990]
                    - paragraph [ref=e991]:
                      - text: "OMeta is the most elegant if your goal is to unify parsing and structural transformation. It is excellent for experimentation and for seeing compiler construction as a pattern-matching problem. Its weakness is that this elegance depends on semantic discipline: backtracking plus side effects, selective memoization, and inheritance-based extension make the system powerful but less rigidly staged than mainstream compiler pipelines."
                      - link "Tin Lizzie +2 Tin Lizzie +2" [ref=e994] [cursor=pointer]:
                        - /url: https://tinlizzie.org/~awarth/papers/dls07.pdf
                        - generic [ref=e995]:
                          - generic [ref=e996]:
                            - generic [ref=e997]: Tin Lizzie
                            - generic [ref=e998]: "+2"
                          - generic [ref=e999]:
                            - generic [ref=e1000]: Tin Lizzie
                            - generic [ref=e1001]: "+2"
                    - paragraph [ref=e1002]:
                      - text: "Racket is the strongest textual answer to extensible languages. It preserves ordinary file-based, parser-based development while letting languages be installed, mixed, and evolved as modules and libraries. Its advantage over OMeta is ecosystem realism: it scales the idea of language extension into a full programming platform. Its limitation, by Racket’s own account, is that conventional syntax, security, and multi-language tooling still impose hard engineering and research problems."
                      - link "CCS Northeastern University +3 Racket Documentation +3 CCS Northeastern University +3" [ref=e1005] [cursor=pointer]:
                        - /url: https://docs.racket-lang.org/guide/module-languages.html
                        - generic [ref=e1006]:
                          - generic [ref=e1007]:
                            - generic [ref=e1008]: CCS Northeastern University
                            - generic [ref=e1009]: "+3"
                          - generic [ref=e1010]:
                            - generic [ref=e1011]: Racket Documentation
                            - generic [ref=e1012]: "+3"
                          - generic [ref=e1013]:
                            - generic [ref=e1014]: CCS Northeastern University
                            - generic [ref=e1015]: "+3"
                    - paragraph [ref=e1016]:
                      - text: MPS is the strongest answer when notation and tooling are the real bottlenecks. If you need diagrams, tables, form-like editors, composition of heterogeneous DSLs, or deep IDE integration, projectional editing can do things parser-based systems struggle with. The cost is the loss of ordinary text as the primary artifact, plus the learning curve and interaction constraints that come with AST-first editing.
                      - link "JetBrains +3 JetBrains +3 JetBrains +3" [ref=e1019] [cursor=pointer]:
                        - /url: https://www.jetbrains.com/help/mps/mps-faq.html
                        - generic [ref=e1020]:
                          - generic [ref=e1021]:
                            - generic [ref=e1022]: JetBrains
                            - generic [ref=e1023]: "+3"
                          - generic [ref=e1024]:
                            - generic [ref=e1025]: JetBrains
                            - generic [ref=e1026]: "+3"
                          - generic [ref=e1027]:
                            - generic [ref=e1028]: JetBrains
                            - generic [ref=e1029]: "+3"
                    - paragraph [ref=e1030]:
                      - text: The deepest connection among all three is that they treat language design as a normal programming activity, not as a rare act of infrastructure construction. Their deepest disagreement is about where the irreducible core lies. OMeta says the core is generalized matching over structured data. Racket says the core is a programmable host with module-scoped language choice. MPS says the core is the abstract model plus projections and semantics. Traditional compiler architecture treats these as supporting machinery around a fixed language; these systems treat them as the real locus of language design.
                      - link "Tin Lizzie +2 CCS Northeastern University +2" [ref=e1033] [cursor=pointer]:
                        - /url: https://tinlizzie.org/~awarth/papers/dls07.pdf
                        - generic [ref=e1034]:
