- id: semantic-identity-as-explicit-projection-obs
  type: text
  data:
    text: TestJSONIsDeterministicAcrossMapInsertionOrder asserts that maps inserted in different orders produce equal digests, with the golden digest 43258cff783fe7036d8a43033f830adfc60ec037382473548ac742b888292777 (pkg/digest/digest_test.go:18-26).
    preset: body
- id: semantic-identity-as-explicit-projection-rule2
  type: rule
  data:
    weight: heavy
- id: semantic-identity-as-explicit-projection-note
  type: text
  data:
    text: This guarantees deterministic encoding of the supplied input, not that callers selected every field affecting the result; NewKey's doc comment explicitly puts that responsibility on callers.
    preset: body
  style:
    font: '''DejaVu Sans'', sans-serif'
    textCase: none
