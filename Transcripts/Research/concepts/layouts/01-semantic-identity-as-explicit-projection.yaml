almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
- id: semantic-identity-as-explicit-projection-title
  type: title
  data:
    text: SEMANTIC IDENTITY AS EXPLICIT PROJECTION
    subtitle: Concept 01 · a digest is not a policy
- id: semantic-identity-as-explicit-projection-sym-label
  type: text
  data:
    text: SYMBOLS
    preset: micro
- id: semantic-identity-as-explicit-projection-sym
  type: table
  data:
    cols:
    - label: SYM
      w: 78
    - label: MEANING
      w: 1fr
    rows:
    - - X
      - complete runtime requests
    - - P
      - the projection retaining semantic fields
    - - C
      - canonical JSON encoding
    - - H
      - SHA-256 digest
- id: semantic-identity-as-explicit-projection-law
  type: banner
  data:
    text: ID(x)=H(C(P(x)))
    pad: m
  style:
    font: '''DejaVu Sans'', sans-serif'
    textCase: none
- id: semantic-identity-as-explicit-projection-law2
  type: text
  data:
    text: same projection, same identity
    preset: body
    align: center
  style:
    font: '''DejaVu Sans'', sans-serif'
    textCase: none
- id: semantic-identity-as-explicit-projection-disc-label
  type: text
  data:
    text: DISCIPLINE
    preset: micro
- id: semantic-identity-as-explicit-projection-disc
  type: table
  data:
    cols:
    - label: IT IS
      w: 1fr
    - label: IT IS NOT
      w: 1fr
    rows:
    - - explicit semantic fields
      - all struct fields
    - - versioned cache identity
      - a truth certificate
    - - deterministic bytes
      - automatic semantic judgment
- id: semantic-identity-as-explicit-projection-vocab
  type: kv
  data:
    items:
    - - LOCAL
      - execution.NewKey, digest.JSON, InputDigest
    - - AS A PATTERN
      - semantic identity projection
    - - ELSEWHERE
      - canonical identity, content addressing, cache key
- id: semantic-identity-as-explicit-projection-rule1
  type: rule
  data:
    weight: thick
- id: semantic-identity-as-explicit-projection-sight
  type: text
  data:
    text: SIGHTED IN  NewKey()
    preset: micro
