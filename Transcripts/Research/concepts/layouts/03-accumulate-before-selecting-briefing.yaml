- id: accumulate-before-selecting-b0-label
  type: text
  data:
    text: WHY IT EXISTS
    preset: micro
- id: accumulate-before-selecting-b0-text
  type: text
  data:
    text: Concurrent workers finish in an order determined by timing, latency, retries, and batching. If the first results consume the budget or become the selected evidence, identical work can produce different answers. Accumulate complete candidates first; rank and select only after the available evidence has a defined boundary.
    preset: body
  style:
    textCase: none
