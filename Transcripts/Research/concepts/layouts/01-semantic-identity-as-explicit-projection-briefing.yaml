- id: semantic-identity-as-explicit-projection-b2-rule
  type: rule
  data:
    weight: thick
- id: semantic-identity-as-explicit-projection-b2-label
  type: text
  data:
    text: A DESIGN DECISION
    preset: micro
- id: semantic-identity-as-explicit-projection-b2-text
  type: text
  data:
    text: 'The key keeps Step and Version beside the input digest. Version is a deliberate escape hatch: when identity semantics change, a new namespace prevents old cache entries from silently changing meaning. JSON gives the implementation a deterministic byte representation for the admitted input; it does not decide which input should have been admitted.'
    preset: body
  style:
    textCase: none
- id: semantic-identity-as-explicit-projection-b3-rule
  type: rule
  data:
    weight: thick
- id: semantic-identity-as-explicit-projection-b3-label
  type: text
  data:
    text: THEORETICAL UNDERPINNINGS
    preset: micro
- id: semantic-identity-as-explicit-projection-b3-kv
  type: kv
  data:
    items:
    - - PROJECTION
      - chooses semantic fields
    - - CANONICALIZATION
      - chooses stable representation
    - - HASHING
      - commits to the representation
- id: semantic-identity-as-explicit-projection-b3-text
  type: text
  data:
    text: 'This is an equivalence-relation idea. Two runtime requests are equivalent when the identity projection cannot distinguish them: x ≡ y iff P(x) = P(y). The projection P decides what “same meaning” means; canonicalization C turns that choice into stable bytes; hashing H makes the bytes addressable. The law is ID(x) = H(C(P(x))). A digest cannot repair an incomplete projection: omitted model, prompt, corpus, or normalization fields can produce a false cache hit. The mathematics separates policy, representation, and commitment; it does not prove the policy is complete.'
    preset: body
  style:
    textCase: none
- id: semantic-identity-as-explicit-projection-b4-rule
  type: rule
  data:
    weight: thick
- id: semantic-identity-as-explicit-projection-b4-label
  type: text
  data:
    text: TWO LAYERS
    preset: micro
- id: semantic-identity-as-explicit-projection-b4-kv
  type: kv
  data:
    items:
    - - POLICY
      - P chooses what can change the result
    - - REPRESENTATION
      - C turns that choice into stable bytes
    - - COMMITMENT
      - H makes the bytes addressable
- id: semantic-identity-as-explicit-projection-b4-text
  type: text
  data:
    text: Most identity bugs are omissions in P or a missing version, not failures of SHA-256.
    preset: body
  style:
    textCase: none
- id: semantic-identity-as-explicit-projection-b5-rule
  type: rule
  data:
    weight: thick
- id: semantic-identity-as-explicit-projection-b5-label
  type: text
  data:
    text: WHO CALLS IT
    preset: micro
- id: semantic-identity-as-explicit-projection-b5-text
  type: text
  data:
    text: NewKey has real callers in summary generation, cached embedding, generation, reranking, examples, and experiment helpers. The package exposes the primitive; each caller must construct the input containing every result-affecting identity, as the NewKey doc comment requires.
    preset: body
  style:
    textCase: none
- id: semantic-identity-as-explicit-projection-b6-rule
  type: rule
  data:
    weight: thick
- id: semantic-identity-as-explicit-projection-b6-label
  type: text
  data:
    text: TRAP
    preset: micro
- id: semantic-identity-as-explicit-projection-b6-text
  type: text
  data:
    text: A digest cannot detect a field you failed to include. Adding workers to a projection can create false misses; omitting a model, prompt, corpus, or normalization identity can create a false hit. Deterministic JSON is not proof that the projection is semantically complete.
    preset: body
  style:
    textCase: none
- id: semantic-identity-as-explicit-projection-b7-rule
  type: rule
  data:
    weight: thick
- id: semantic-identity-as-explicit-projection-b7-label
  type: text
  data:
    text: IF YOU ADD ONE
    preset: micro
- id: semantic-identity-as-explicit-projection-b7-checks
  type: checks
  data:
    items:
    - Name the object whose identity is being computed.
    - 'Classify each field: semantic, lineage, observation, presentation, or operational.'
    - Add every result-affecting field to the explicit input record.
    - Bump Version when the identity contract changes.
    - Add a deterministic golden test and a changed-input test.
    - Verify the cache key with zero-work replay before trusting reuse.
    columns: 1
