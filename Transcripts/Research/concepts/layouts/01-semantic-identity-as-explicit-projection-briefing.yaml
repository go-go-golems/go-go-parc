- id: semantic-identity-as-explicit-projection-b-title
  type: title
  data:
    text: SEMANTIC IDENTITY AS EXPLICIT PROJECTION
    subtitle: pkg/execution/cache.go:24-51
- id: semantic-identity-as-explicit-projection-b0-rule
  type: rule
  data:
    weight: thick
- id: semantic-identity-as-explicit-projection-b0-label
  type: text
  data:
    text: WHY IT EXISTS
    preset: micro
- id: semantic-identity-as-explicit-projection-b0-text
  type: text
  data:
    text: Caches need to know when two requests mean the same thing. Worker count, display labels, credentials, prompts, models, and corpus releases do not all have the same semantic status. If identity is an accidental struct dump, harmless changes cause misses; if important fields are omitted, stale work can be reused. Decide the identity fields first, then encode and hash them.
    preset: body
  style:
    textCase: none
- id: semantic-identity-as-explicit-projection-b1-rule
  type: rule
  data:
    weight: thick
