id: "03"
slug: accumulate-before-selecting
title: ACCUMULATE BEFORE SELECTING
subtitle: Concept 03 · timing must not choose evidence
one_liner: >-
  Collect complete results into an order-independent state before ranking,
  budgeting, deduplicating, or assigning labels.

