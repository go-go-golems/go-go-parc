    StrictMode: ({ children }) => children,

    useMemo,
    useCallback,
    useRef,

    createRoot(container) {
      return {
        render(vnode) {
          rootContainer = container;
          rootVNode = vnode;
          renderRoot();
        },
      };
    },
  };

  window.ReactDOM = ReactDOM;
