<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>P09 · Coalgebraic Interaction Machines</title>
<style>:root {
  color-scheme: light;
  --paper: #ffffff;
  --pane: #ffffff;
  --pane-alt: #f1f1ee;
  --ink: #23262b;
  --faint: #737980;
  --line: #d9d9d4;
  --sage: #7cae9b;
  --blue: #7aa6c9;
  --rose: #d59a86;
  --mustard: #e0b95c;
  --lavender: #a99fc9;
  --mint: #8fc7b0;
  --red: #c2503a;
  --green: #3f9d6b;
  --sel: #fdeec6;
  --warm: #faf7ee;
}

* { box-sizing: border-box; }
html, body, #root { margin: 0; min-height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 12px;
}
button, select, input, textarea { font: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--mustard);
  outline-offset: 1px;
}
code { font-family: inherit; font-size: 0.94em; }

.app-shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  background: var(--ink);
  color: var(--paper);
  display: flex;
  gap: 24px;
  justify-content: space-between;
  align-items: flex-end;
  padding: 14px 20px 12px;
  border-bottom: 5px solid var(--mustard);
}
.topbar h1 { margin: 2px 0 0; font-size: 22px; letter-spacing: 0.04em; }
.eyebrow { color: var(--mustard); font-weight: 700; letter-spacing: 0.18em; font-size: 10px; }
.topbar-formula { color: #dedede; font-size: 11px; letter-spacing: 0.03em; text-align: right; }
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 8px 12px 0;
  border-bottom: 2px solid var(--ink);
  background: var(--pane-alt);
}
.tab {
  appearance: none;
  border: 2px solid var(--ink);
  border-bottom: 0;
  background: var(--paper);
  color: var(--ink);
  padding: 4px 10px 5px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.tab:hover { background: var(--sel); }
.tab-active { background: var(--mustard); box-shadow: 2px -2px 0 var(--ink); }
main { flex: 1; padding: 12px; }
footer {
  background: var(--ink);
  color: var(--paper);
  display: flex;
  justify-content: space-between;
  gap: 14px;
  padding: 5px 12px;
  color: #c9c9c9;
  font-size: 9.5px;
}

.page-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(360px, 0.85fr); gap: 12px; align-items: start; }
.overview-grid { grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.95fr); }
.parallel-grid, .two-col, .comparison-cards, .graph-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.section {
  border: 2px solid var(--ink);
  background: var(--pane);
  margin-bottom: 12px;
  box-shadow: 3px 3px 0 var(--ink);
  padding: 8px;
  min-width: 0;
}
.section-head {
  display: flex;
  align-items: center;
  gap: 7px;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 5px;
  margin-bottom: 7px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.section-head-spacer, .spacer { flex: 1; }
.card {
  border: 1px solid var(--ink);
  border-left: 6px solid var(--line);
  background: var(--pane);
  padding: 7px 8px;
  margin-bottom: 7px;
  min-width: 0;
}
.card h3 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.card p { margin: 3px 0; line-height: 1.48; }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.toolbar { margin-bottom: 7px; padding: 5px; background: var(--pane-alt); border: 1px solid var(--line); }
.toolbar label { font-size: 9px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; }
select, input, textarea {
  border: 1px solid var(--ink);
  background: var(--paper);
  padding: 3px 5px;
  min-width: 0;
}
select { max-width: 290px; }
.button {
  border: 2px solid var(--ink);
  color: var(--ink);
  padding: 4px 10px;
  box-shadow: 2px 2px 0 var(--ink);
  cursor: pointer;
  font-weight: 700;
  line-height: 1.2;
}
.button:hover:not(:disabled) { filter: brightness(1.04); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
.button:active:not(:disabled) { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.button:disabled { cursor: default; opacity: 0.48; box-shadow: none; }
.button-small { padding: 2px 6px; font-size: 9.5px; box-shadow: 1px 1px 0 var(--ink); }
.controls-row { margin-top: 7px; }
.chip {
  display: inline-block;
  border: 1px solid var(--ink);
  border-left: 4px solid var(--line);
  background: var(--paper);
  padding: 1px 5px;
  font-size: 9.5px;
  white-space: nowrap;
}
.muted { color: var(--faint); font-size: 10px; line-height: 1.4; }
.body-copy { line-height: 1.55; margin: 6px 0; }
.empty { color: var(--faint); padding: 8px; background: var(--pane-alt); border: 1px dashed var(--line); }
.formal-block { font-family: Georgia, "Times New Roman", serif; font-size: 13px; }
.formal-equation { text-align: center; font-size: 20px; margin: 4px 0 10px; }
.flow-line { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; justify-content: center; padding: 8px; background: var(--warm); border: 1px solid var(--line); }
.experiment-list { margin: 0; padding-left: 22px; line-height: 1.52; }
.experiment-list li { margin-bottom: 6px; }
.law-list { display: grid; gap: 4px; }
.law-row { display: flex; gap: 7px; align-items: baseline; padding: 4px 6px; border-bottom: 1px dotted var(--line); line-height: 1.4; }
.law-row span { color: var(--green); font-weight: 800; }

.observation-card { background: var(--warm); }
.observation-title { margin-bottom: 5px; }
.prompt { font-family: Georgia, "Times New Roman", serif; font-size: 14px; line-height: 1.42; margin: 4px 0; }
.expected { display: inline-block; background: var(--sel); border: 1px solid var(--ink); padding: 2px 6px; margin: 3px 0; font-weight: 700; }
.error-box { border: 2px solid var(--red); background: #fff1ed; padding: 6px; margin: 5px 0; color: #7c2518; }
.pass-box { border: 2px solid var(--green); background: #edf8f1; padding: 6px; margin: 5px 0; }
.resolution { background: #edf8f1; border: 1px solid var(--green); padding: 4px 6px; margin-top: 5px; }
.observation-foot { color: var(--faint); font-size: 9px; overflow-wrap: anywhere; margin-top: 5px; border-top: 1px dotted var(--line); padding-top: 4px; }
.progress { display: inline-block; width: 90px; height: 9px; border: 1px solid var(--ink); background: var(--paper); }
.progress-fill { display: block; height: 100%; }

.candidate-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 7px; margin-top: 8px; }
.candidate { border: 2px solid var(--ink); background: var(--paper); padding: 6px; box-shadow: 2px 2px 0 var(--ink); }
.candidate:hover { background: var(--sel); }
.candidate-captured { outline: 3px solid var(--mustard); outline-offset: 2px; }
.candidate-sort { color: var(--red); font-size: 9px; font-weight: 700; }
.candidate-label { font-weight: 700; margin: 3px 0; line-height: 1.35; }
.candidate-meta { color: var(--faint); font-size: 8.5px; margin-bottom: 5px; }

.trace-table-wrap { max-height: 680px; overflow: auto; border: 1px solid var(--line); }
.trace-table { border-collapse: collapse; width: 100%; font-size: 9px; }
.trace-table td { border-bottom: 1px dotted var(--line); padding: 2px 4px; vertical-align: top; overflow-wrap: anywhere; }
.trace-seq { width: 32px; color: var(--faint); text-align: right; }
.trace-type { width: 165px; font-weight: 700; }
.json { margin: 0; padding: 7px; border: 1px solid var(--line); background: var(--pane-alt); overflow: auto; white-space: pre-wrap; word-break: break-word; font-size: 9.5px; line-height: 1.42; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin: 6px 0; }
.metrics .card { display: flex; flex-direction: column; gap: 2px; margin: 0; }
.metrics b { font-size: 18px; }
.metrics span { font-size: 8.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; }
.event-list { display: grid; gap: 2px; }
.event-list .card { margin: 0; }
.key-value { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; padding: 2px 0; border-bottom: 1px dotted var(--line); }
.key-value-key { color: var(--faint); text-transform: uppercase; font-size: 8.5px; letter-spacing: 0.06em; }
.key-value-value { min-width: 0; overflow-wrap: anywhere; }

.data-table { border-collapse: collapse; width: 100%; font-size: 9.5px; }
.data-table th { text-align: left; background: var(--ink); color: var(--paper); padding: 3px 5px; }
.data-table td { padding: 3px 5px; border-bottom: 1px dotted var(--line); vertical-align: top; overflow-wrap: anywhere; }
.big-status { font-size: 24px; font-weight: 900; line-height: 1; margin-bottom: 4px; }
.graph-grid h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; }

@media (max-width: 1050px) {
  .page-grid, .overview-grid, .parallel-grid, .graph-grid { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  main { padding: 7px; }
  .topbar { align-items: flex-start; flex-direction: column; }
  .topbar-formula { text-align: left; }
  .two-col, .comparison-cards { grid-template-columns: 1fr; }
  .tabs { overflow-x: auto; flex-wrap: nowrap; }
  .tab { white-space: nowrap; }
  footer { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
}

 * Tiny dependency-free JSX runtime used only to make this research artifact
 * a single offline HTML file. It deliberately implements the small React
 * surface used by the lab: function components, createElement, useState,
 * useMemo, useCallback, useRef, fragments, and a root renderer.

 * This is an adapter, not part of the coalgebraic interaction semantics.

    return left.every((value, index) => Object.is(value, right[index]));

      instances.set(componentPath, instance);

      const previousIndex = hookIndex;

      hookIndex = 0;

        rendered = vnode.type(vnode.props ?? {});
      } finally {

        hookIndex = previousIndex;

    }

      throw new Error(`Unsupported JSX node type: ${String(vnode.type)}`);
    }

    const element = document.createElement(vnode.type);
    element.setAttribute("data-mini-path", path);
    elements.set(path, element);
    const deferred = applyProps(element, vnode.props);
    const children = flatten(vnode.props?.children ?? []);
    children.forEach((child, index) => element.appendChild(renderVNode(child, childPath(path, child, index), elements)));

      try { element[name] = value ?? ""; } catch { /* ignored for readonly properties */ }

    if (typeof vnode.props?.ref === "function") vnode.props.ref(element);

    return element;
  }

  function renderRoot() {
    if (!rootContainer || !rootVNode) return;
    rendering = true;
    rerenderRequested = false;
    const active = document.activeElement;
    const activePath = active?.getAttribute?.("data-mini-path") ?? null;
    const selection = active && typeof active.selectionStart === "number"
      ? { start: active.selectionStart, end: active.selectionEnd }
      : null;
    const elements = new Map();
    const next = renderVNode(rootVNode, "root", elements);
    rootContainer.replaceChildren(next);
    if (activePath && elements.has(activePath)) {
      const replacement = elements.get(activePath);
      replacement.focus?.();
      if (selection && typeof replacement.setSelectionRange === "function") {
        try { replacement.setSelectionRange(selection.start, selection.end); } catch { /* unsupported input type */ }
      }
    }
    rendering = false;
    if (rerenderRequested) renderRoot();
  }

  const React = {
    createElement,
    Fragment,
    StrictMode: ({ children }) => children,
    useState,
    useMemo,
    useCallback,
    useRef,
  };

  const ReactDOM = {
    createRoot(container) {
      return {
        render(vnode) {
          rootContainer = container;
          rootVNode = vnode;
          renderRoot();
        },
      };
    },
  };

  window.React = React;
  window.ReactDOM = ReactDOM;
})();
</script>
