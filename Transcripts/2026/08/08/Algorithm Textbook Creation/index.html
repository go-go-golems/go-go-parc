<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop-Cutter CAM Algorithm Lab</title>
<style>
:root{--bg:#0f1217;--panel:#181d25;--panel2:#202733;--ink:#e5e9f0;--dim:#98a3b3;--accent:#ffb000;--line:#343d4b;--good:#57c785;--bad:#e15d4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}header{height:74px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between}h1{font-family:system-ui,sans-serif;letter-spacing:.08em;margin:0;font-size:21px}h1 b{color:var(--accent)}header p{margin:4px 0 0;color:var(--dim);font-size:12px}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--dim);font-size:11px}.layout{height:calc(100vh - 74px);display:grid;grid-template-columns:250px 1fr}.nav{padding:18px;background:var(--panel);border-right:1px solid var(--line)}button.tab{width:100%;text-align:left;margin:0 0 8px;padding:12px 13px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--ink);cursor:pointer;font:inherit}.tab.active{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.nav .note{color:var(--dim);font-size:11px;line-height:1.55;margin-top:20px}.main{padding:18px;min-width:0;overflow:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:calc(100vh - 112px)}.card-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card-head h2{margin:0;font:600 17px system-ui,sans-serif}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--dim);font-size:12px}.controls label{display:flex;align-items:center;gap:8px}.controls input[type=range]{width:145px}.controls select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:5px}.stage{position:relative;height:640px}.stage canvas{width:100%;height:100%;display:block}.formula{position:absolute;left:18px;bottom:16px;background:rgba(15,18,23,.86);border:1px solid var(--line);border-radius:6px;padding:10px 13px;font-size:12px;line-height:1.55;max-width:62%}.readout{color:var(--accent);font-weight:700}.legend{position:absolute;right:18px;bottom:16px;background:rgba(15,18,23,.86);border:1px solid var(--line);border-radius:6px;padding:10px 13px;font-size:11px;line-height:1.6}.small{font-size:11px;color:var(--dim)}
</style></head>
<body><header><div><h1>DROP<b>CUT</b> ALGORITHM LAB</h1><p>Interactive constructions used in the repaired CAM implementation</p></div><div class="badge">standalone Canvas • no external dependencies</div></header>
<div class="layout"><nav class="nav" id="nav"></nav><main class="main"><section class="card"><div class="card-head"><h2 id="title"></h2><div class="controls" id="controls"></div></div><div class="stage"><canvas id="c"></canvas><div class="formula" id="formula"></div><div class="legend" id="legend"></div></div></section></main></div>
<script src="data.js"></script><script>
const scenes=[
 {id:'contact',name:'1 · Drop-cutter contact'},
 {id:'marching',name:'2 · Marching squares'},
 {id:'scallop',name:'3 · Scallop geometry'},
 {id:'metric',name:'4 · Surface metric'},
 {id:'dexel',name:'5 · Dexel verification'}];
const nav=document.getElementById('nav'),canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),controls=document.getElementById('controls'),formula=document.getElementById('formula'),legend=document.getElementById('legend'),title=document.getElementById('title');
let scene=new URLSearchParams(location.search).get('scene')||'contact';
for(const s of scenes){const b=document.createElement('button');b.className='tab';b.textContent=s.name;b.onclick=()=>{scene=s.id;history.replaceState(null,'','?scene='+scene);render()};b.dataset.id=s.id;nav.appendChild(b)}
const n=document.createElement('div');n.className='note';n.innerHTML='<b>Use</b><br>Move the sliders to inspect how the numerical construction changes. Screenshots in the textbook are captured from these scenes.<br><br><b>Coordinate convention</b><br>Z is the tool axis. The displayed cutter location is the tool tip.';nav.appendChild(n);
function fit(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0)}
function clear(){fit();ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);ctx.fillStyle='#11161d';ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight)}
function line(a,b,w=2,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.lineWidth=w;ctx.strokeStyle='#d6dde8';ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();ctx.setLineDash([])}
function dot(p,r=4,fill='#ffb000'){ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function text(t,p,sz=13,align='left',fill='#d6dde8'){ctx.font=sz+'px ui-monospace,monospace';ctx.textAlign=align;ctx.fillStyle=fill;ctx.fillText(t,...p)}
function range(label,min,max,step,value,id){return `<label>${label}<input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"><span id="${id}v" class="readout"></span></label>`}
function hook(ids){for(const id of ids)document.getElementById(id).oninput=renderStage}
function coord(x,z){const W=canvas.clientWidth,H=canvas.clientHeight;return [W*.5+x*W*.095,H*.83-z*H*.105]}
function contact(){title.textContent='Exact drop-cutter contact as a maximization problem';controls.innerHTML=`<label>Cutter <select id="tool"><option>ball</option><option>flat</option></select></label>${range('radius',.6,2.2,.05,1.35,'R')}${range('X',-2.5,2.5,.02,.35,'X')}`;hook(['R','X']);document.getElementById('tool').onchange=renderStage;renderStage()}
function contactStage(){clear();const tool=document.getElementById('tool').value,R=+Rr().value,X=+Xr().value;document.getElementById('Rv').textContent=R.toFixed(2);document.getElementById('Xv').textContent=X.toFixed(2);const V=[[-3,0],[-.7,2.7],[2.8,.65]],samples=[];for(let e=0;e<2;e++)for(let i=0;i<=600;i++){const t=i/600,x=V[e][0]*(1-t)+V[e+1][0]*t,z=V[e][1]*(1-t)+V[e+1][1]*t;if(Math.abs(x-X)<=R){const tip=tool==='ball'?z+Math.sqrt(Math.max(0,R*R-(x-X)*(x-X)))-R:z;samples.push([tip,x,z,e,t])}}samples.sort((a,b)=>b[0]-a[0]);const best=samples[0]||[0,X,0,0,0],tip=best[0],cp=[best[1],best[2]];for(let i=0;i<V.length-1;i++)line(coord(...V[i]),coord(...V[i+1]),3);V.forEach((p,i)=>{dot(coord(...p),5);text('v'+i,[coord(...p)[0]+8,coord(...p)[1]-8])});const c=coord(X,tip+(tool==='ball'?R:0));if(tool==='ball'){ctx.beginPath();ctx.arc(c[0],c[1],R*canvas.clientWidth*.095,0,Math.PI*2);ctx.strokeStyle='#ffb000';ctx.lineWidth=3;ctx.stroke()}else{line(coord(X-R,tip),coord(X+R,tip),4)}dot(coord(X,tip),5,'#57c785');dot(coord(...cp),5,'#e15d4f');line(coord(X,tip),coord(X,0),1,[5,5]);text('contact', [coord(...cp)[0]+10,coord(...cp)[1]-10]);text('tool tip', [coord(X,tip)[0]+10,coord(X,tip)[1]+18]);formula.innerHTML=`For a ball cutter, the feasible tip height is<br><b>z<sub>tip</sub>(X)=max<sub>p∈triangle</sub>[z(p)+√(R²-‖p<sub>xy</sub>-X‖²)-R]</b>.<br>Current result: <span class="readout">z<sub>tip</sub> = ${tip.toFixed(3)}</span>`;legend.innerHTML='<span style="color:#ffb000">○</span> cutter<br><span style="color:#e15d4f">●</span> active contact<br><span style="color:#57c785">●</span> tool tip'}
function Rr(){return document.getElementById('R')}function Xr(){return document.getElementById('X')}
function marching(){title.textContent='Marching squares and the asymptotic decider';controls.innerHTML=range('corner f11',.05,1.2,.01,.25,'q');hook(['q']);renderStage()}
function marchingStage(){clear();const q=+document.getElementById('q').value;document.getElementById('qv').textContent=q.toFixed(2);const W=canvas.clientWidth,H=canvas.clientHeight,s=Math.min(W,H)*.66,x0=(W-s)/2,y0=(H-s)/2,vals=[2,-1,q,-1],N=120;function f(u,v){return vals[0]*(1-u)*(1-v)+vals[1]*u*(1-v)+vals[2]*u*v+vals[3]*(1-u)*v}for(let j=0;j<N;j++)for(let i=0;i<N;i++){const v=f((i+.5)/N,(j+.5)/N),a=Math.min(1,Math.abs(v)/2);ctx.fillStyle=v>0?`rgba(255,176,0,${.12+.45*a})`:`rgba(79,200,221,${.12+.45*a})`;ctx.fillRect(x0+i*s/N,y0+(N-1-j)*s/N,s/N+1,s/N+1)}ctx.strokeStyle='#e5e9f0';ctx.lineWidth=2;ctx.strokeRect(x0,y0,s,s);const pts=[];function interp(a,b){return a/(a-b)}const E=[[x0+s*interp(vals[0],vals[1]),y0+s],[x0+s,y0+s*(1-interp(vals[1],vals[2]))],[x0+s*interp(vals[3],vals[2]),y0],[x0,y0+s*(1-interp(vals[0],vals[3]))]];const Q=vals[0]*vals[2]-vals[1]*vals[3],pairs=Q>0?[[0,1],[2,3]]:[[3,0],[1,2]];for(const [a,b] of pairs){ctx.beginPath();ctx.moveTo(...E[a]);ctx.lineTo(...E[b]);ctx.strokeStyle='#ffffff';ctx.lineWidth=4;ctx.stroke()}const corners=[[x0,y0+s],[x0+s,y0+s],[x0+s,y0],[x0,y0]];corners.forEach((p,i)=>{dot(p,6);text((vals[i]>0?'+':'')+vals[i].toFixed(2),[p[0]+(i===0||i===3?-12:12),p[1]+(i<2?24:-14)],13,i===0||i===3?'right':'left')});formula.innerHTML=`Bilinear decider: <b>Q=f<sub>00</sub>f<sub>11</sub>-f<sub>10</sub>f<sub>01</sub></b>.<br>Current <span class="readout">Q=${Q.toFixed(3)}</span>; changing its sign flips contour connectivity.`;legend.innerHTML='<span style="color:#ffb000">■</span> positive field<br><span style="color:#4fc8dd">■</span> negative field<br><span>━</span> extracted zero contour'}
function scallop(){title.textContent='Ball-end scallop height and nominal stepover';controls.innerHTML=range('radius',.8,4,.05,2,'sr')+range('scallop h',.005,.5,.005,.08,'sh');hook(['sr','sh']);renderStage()}
function scallopStage(){clear();const R=+document.getElementById('sr').value,h=Math.min(+document.getElementById('sh').value,1.99*R),s=2*Math.sqrt(Math.max(0,2*R*h-h*h));document.getElementById('srv').textContent=R.toFixed(2);document.getElementById('shv').textContent=h.toFixed(3);const W=canvas.clientWidth,H=canvas.clientHeight,sc=Math.min(W/11,H/6),base=H*.78;for(const cx of [W/2-s*sc/2,W/2+s*sc/2]){ctx.beginPath();ctx.arc(cx,base-R*sc,R*sc,0,Math.PI*2);ctx.strokeStyle='#ffb000';ctx.lineWidth=3;ctx.stroke();dot([cx,base],4,'#57c785')}const mid=W/2,cusp=base-h*sc;line([mid,base],[mid,cusp],2);text('h',[mid+10,(base+cusp)/2]);line([W/2-s*sc/2,base+30],[W/2+s*sc/2,base+30],2);text('s',[W/2,base+55],14,'center');formula.innerHTML=`<b>s=2√(2Rh-h²)</b><br>For R=${R.toFixed(2)} and h=${h.toFixed(3)}, <span class="readout">s=${s.toFixed(3)}</span>. This is exact only for the two-circle cross-section on a locally flat surface.`;legend.innerHTML='R = tool radius<br>h = cusp/scallop height<br>s = nominal stepover'}
function metric(){title.textContent='Induced surface metric versus isotropic slope scaling';controls.innerHTML=range('plane slope a',0,3,.05,1.5,'a')+range('spacing',.5,2,.05,1,'ms');hook(['a','ms']);renderStage()}
function metricStage(){clear();const a=+document.getElementById('a').value,sp=+document.getElementById('ms').value;document.getElementById('av').textContent=a.toFixed(2);document.getElementById('msv').textContent=sp.toFixed(2);const W=canvas.clientWidth,H=canvas.clientHeight,cx=W*.5,cy=H*.5,sc=Math.min(W,H)*.095;ctx.strokeStyle='#343d4b';ctx.lineWidth=1;for(let k=-7;k<=7;k++){line([cx+k*sc,70],[cx+k*sc,H-70],1);line([70,cy+k*sc],[W-70,cy+k*sc],1)}for(let n=1;n<=5;n++){ctx.beginPath();ctx.ellipse(cx,cy,n*sp*sc/Math.sqrt(1+a*a),n*sp*sc,0,0,Math.PI*2);ctx.strokeStyle='#ffb000';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,n*sp*sc/Math.sqrt(1+a*a),0,Math.PI*2);ctx.strokeStyle='#4fc8dd';ctx.lineWidth=1.5;ctx.stroke()}line([cx,cy],[cx+2.8*sc,cy],3);text('up-slope x',[cx+2.85*sc,cy-8]);line([cx,cy],[cx,cy-2.8*sc],3);text('cross-slope y',[cx+8,cy-2.9*sc]);formula.innerHTML=`For z=ax, the induced metric is <b>ds²=(1+a²)dx²+dy²</b>.<br><span class="readout">Orange ellipses</span> are equal surface-distance sets; cyan circles apply the same slope factor in every direction.`;legend.innerHTML='<span style="color:#ffb000">━</span> anisotropic surface metric<br><span style="color:#4fc8dd">━</span> isotropic slope magnitude'}
function dexel(){title.textContent='Dexel material-removal verification';controls.innerHTML=range('deviation contrast',.1,.8,.01,.35,'dc');hook(['dc']);renderStage()}
function dexelStage(){clear();const D=window.DEXEL_DATA,lim=+document.getElementById('dc').value;document.getElementById('dcv').textContent=lim.toFixed(2);const W=canvas.clientWidth,H=canvas.clientHeight,pad=55,s=Math.min((W-2*pad)/D.w,(H-2*pad)/D.h),ox=(W-D.w*s)/2,oy=(H-D.h*s)/2;for(let j=0;j<D.h;j++)for(let i=0;i<D.w;i++){const k=j*D.w+i;if(!D.mask[k])continue;const d=D.dev[k];let rgb;if(d<-D.gougeTol){const t=Math.min(1,(-d-D.gougeTol)/lim);rgb=[225,80-30*t,65-20*t]}else if(d<=D.band){const t=Math.max(0,d)/D.band;rgb=[70+90*t,175-20*t,105+60*t]}else{const t=Math.min(1,(d-D.band)/lim);rgb=[80-15*t,125-15*t,190+45*t]}ctx.fillStyle=`rgb(${rgb.map(x=>Math.round(x)).join(',')})`;ctx.fillRect(ox+i*s,oy+(D.h-1-j)*s,s+1,s+1)}ctx.strokeStyle='#e5e9f0';ctx.strokeRect(ox,oy,D.w*s,D.h*s);formula.innerHTML=`Each cutting move sweeps the cutter footprint over a height field. The deviation is <b>d=H<sub>machined</sub>-H<sub>target</sub></b>.<br>Statistics are computed only on the projected part mask, not on the whole stock rectangle.`;legend.innerHTML='<span style="color:#e15d4f">■</span> gouge (d&lt;−tol)<br><span style="color:#57c785">■</span> in tolerance<br><span style="color:#6b8fd4">■</span> excess stock'}
function renderStage(){({contact:contactStage,marching:marchingStage,scallop:scallopStage,metric:metricStage,dexel:dexelStage})[scene]()}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.id===scene));({contact,marching,scallop,metric,dexel})[scene]()}
addEventListener('resize',renderStage);render();
</script></body></html>
